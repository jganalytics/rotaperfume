# ==============================================================================
# DESENHO DA EVOLUÇÃO DO JOB DA PIPELINE (rotaperfume_pipeline):
#
# Arquitetura de Entregas (Prompts 1 a 6):
#
#   ┌──────────────────────────┐
#   │  1. raw_conferencia      │ <-- [Prompt 01]
#   └────────────┬─────────────┘
#                │
#   ┌────────────▼─────────────┐
#   │  2. bronze_ingestao      │ <-- [Prompt 02]
#   └────────────┬─────────────┘
#                │
#       ┌────────┴────────┬─────────────────┬──────────────────┐
#       │                 │                 │                  │
#   ┌───▼──────────┐ ┌────▼──────────┐ ┌────▼─────────────┐ ┌───▼─────────────┐
#   │ silver_      │ │ silver_       │ │ silver_itens_    │ │ silver_crm_   │ <-- [Prompt 03]
#   │ clientes     │ │ pedidos       │ │ e_produtos       │ │ e_financeiro  │     (Paralelo)
#   └───┬──────────┘ └────┬──────────┘ └────┬─────────────┘ └───┬─────────────┘
#       └─────────────────┼─────────────────┴───────────────────┘
#                         │
#            ┌────────────▼─────────────┐
#            │  3. gold_dimensoes       │ <-- [Prompt 04]
#            └────────────┬─────────────┘
#                         │
#            ┌────────────▼─────────────┐
#            │  4. gold_fato_vendas     │ <-- [Prompt 04]
#            └────────────┬─────────────┘
#                         │
#            ┌────────────▼─────────────┐
#            │  5. gold_marts           │ <-- [Prompt 04]
#            └────────────┬─────────────┘
#                         │
#          ┌──────────────┴───────────────┐
#          │                              │
#   ┌──────▼──────────┐        ┌──────────▼──────────┐
#   │  6. testes      │        │ 7. metricas_        │ <-- [Prompt 06]
#   │   (Suíte 9)     │        │    de_negocio       │
#   └─────────────────┘        └──────────┬──────────┘
#                                         │
#                              ┌──────────▼──────────┐
#                              │ 8. auditoria_       │ <-- [Prompt 06]
#                              │    de_metadado      │
#                              └─────────────────────┘
# ==============================================================================

resources:
  jobs:
    rotaperfume_pipeline:
      name: rotaperfume_pipeline

      schedule:
        quartz_cron_expression: "0 0 6 * * ?"
        timezone_id: "America/Sao_Paulo"
        pause_status: PAUSED

      tasks:
        - task_key: raw_conferencia
          notebook_task:
            notebook_path: ../src/raw/conferencia.py
            base_parameters:
              catalog: ${var.catalog}

        - task_key: bronze_ingestao
          depends_on:
            - task_key: raw_conferencia
          notebook_task:
            notebook_path: ../src/bronze/ingestao.py
            base_parameters:
              catalog: ${var.catalog}

        - task_key: silver_clientes
          depends_on:
            - task_key: bronze_ingestao
          sql_task:
            file:
              path: ../src/silver/01-clientes.sql
            warehouse_id: ${var.warehouse_id}

        - task_key: silver_pedidos
          depends_on:
            - task_key: bronze_ingestao
          sql_task:
            file:
              path: ../src/silver/02-pedidos.sql
            warehouse_id: ${var.warehouse_id}

        - task_key: silver_itens_e_produtos
          depends_on:
            - task_key: bronze_ingestao
          sql_task:
            file:
              path: ../src/silver/03-itens-e-produtos.sql
            warehouse_id: ${var.warehouse_id}

        - task_key: silver_crm_e_financeiro
          depends_on:
            - task_key: bronze_ingestao
          sql_task:
            file:
              path: ../src/silver/04-crm-e-financeiro.sql
            warehouse_id: ${var.warehouse_id}

        - task_key: gold_dimensoes
          depends_on:
            - task_key: silver_clientes
            - task_key: silver_pedidos
            - task_key: silver_itens_e_produtos
            - task_key: silver_crm_e_financeiro
          sql_task:
            file:
              path: ../src/gold/05-dimensoes.sql
            warehouse_id: ${var.warehouse_id}

        - task_key: gold_fato_vendas
          depends_on:
            - task_key: gold_dimensoes
          sql_task:
            file:
              path: ../src/gold/06-fato-vendas.sql
            warehouse_id: ${var.warehouse_id}

        - task_key: gold_marts
          depends_on:
            - task_key: gold_fato_vendas
          sql_task:
            file:
              path: ../src/gold/07-marts.sql
            warehouse_id: ${var.warehouse_id}

        - task_key: testes
          depends_on:
            - task_key: gold_marts
          sql_task:
            file:
              path: ../src/gold/08-testes.sql
            warehouse_id: ${var.warehouse_id}

        - task_key: metricas_de_negocio
          depends_on:
            - task_key: gold_marts
          sql_task:
            file:
              path: ../src/gold/09-metricas-negocio.sql
            warehouse_id: ${var.warehouse_id}

        - task_key: auditoria_de_metadado
          depends_on:
            - task_key: metricas_de_negocio
          sql_task:
            file:
              path: ../src/gold/10-auditoria-metadado.sql
            warehouse_id: ${var.warehouse_id}
