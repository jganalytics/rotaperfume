# Declarative Automation Bundle definition for rotaperfume.
# Documentation: https://docs.databricks.com/dev-tools/bundles/index.html
bundle:
  name: rotaperfume

include:
  - resources/*.yml

variables:
  catalog:
    description: The catalog to use
    default: lakehouse_rotaperfume
  warehouse_id:
    description: The SQL Warehouse ID to use for serverless execution
    default: 921cca117c00e223

targets:
  dev:
    # ARMADILHA IMPORTANTE: NÃO utilizamos 'mode: development' no target dev.
    # O 'mode: development' prefixa todos os recursos com '[dev meu_usuario]',
    # incluindo os SCHEMAS do Unity Catalog (que virariam dev_fulano_bronze),
    # o que quebraria todo o SQL do projeto.
    # Em vez disso, pausamos o agendamento de jobs explicitamente com trigger_pause_status: PAUSED.
    default: true
    presets:
      trigger_pause_status: PAUSED
    workspace:
      host: https://dbc-49019578-998e.cloud.databricks.com
    variables:
      catalog: lakehouse_rotaperfume
      warehouse_id: 921cca117c00e223

  prod:
    mode: production
    workspace:
      host: https://dbc-49019578-998e.cloud.databricks.com
      root_path: /Workspace/Users/gustavovcoelho@gmail.com/.bundle/${bundle.name}/${bundle.target}
    variables:
      catalog: lakehouse_rotaperfume
      warehouse_id: 921cca117c00e223
